[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minideepseek"
version = "0.1.0"
description = "Self-contained, DeepSeek-V4-isomorphic research models and training pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "torch>=2.9",
  "safetensors>=0.4",
  "tokenizers>=0.20",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# HF format / verl / vLLM are optional; CPU tests only need the base install.
hf = ["transformers>=4.46,<5", "sentencepiece>=0.2", "protobuf>=4"]
# CUDA-only rollout and RL stack.  Install explicitly on the training cluster.
vllm = ["vllm>=0.10"]
verl = ["verl", "vllm>=0.10"]
eval = ["lm-eval>=0.4"]
# Fused CUDA kernels (optional).  Without them the torch reference path is used;
# attn_gym is BSD-3-Clause and provides the Triton/CuTe gather-attention kernel
# that torchtitan's DeepSeek-V4 reference calls.
kernels = ["attn_gym>=0.0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
markers = [
  "slow: tests that take more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
