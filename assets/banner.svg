<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" fill="none" role="img" aria-labelledby="btitle bdesc">
  <title id="btitle">miniDeepSeek — a 60M-class, DeepSeek-V4-isomorphic research stack</title>
  <desc id="bdesc">Dark banner with the miniDeepSeek logo, wordmark and a routed-attention orbit diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060C1C"/>
      <stop offset="0.5" stop-color="#081329"/>
      <stop offset="1" stop-color="#0B1836"/>
    </linearGradient>
    <linearGradient id="word" x1="300" y1="190" x2="1000" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2F7FF"/>
      <stop offset="0.6" stop-color="#D7E5FF"/>
      <stop offset="1" stop-color="#8AB4FF"/>
    </linearGradient>
    <linearGradient id="mark" x1="96" y1="160" x2="236" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9C6FF"/>
      <stop offset="0.5" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#5B8CFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="0.82" stop-color="#5B8CFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientTransform="translate(300 240) rotate(90) scale(420 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F5BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2F5BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientTransform="translate(1350 220) rotate(90) scale(300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#9DB8F5" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#grid)"/>
  <rect width="1600" height="480" fill="url(#glowL)"/>
  <rect width="1600" height="480" fill="url(#glowR)"/>
  <path d="M0 430c180-40 300 30 470 0s300-60 470-20 300 40 660-10" stroke="#3B5BA8" stroke-opacity="0.22" stroke-width="2"/>
  <path d="M0 462c220-36 360 26 560 0s340-44 540-10 260 22 500-16" stroke="#22D3EE" stroke-opacity="0.1" stroke-width="2"/>

