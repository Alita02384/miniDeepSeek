    <circle cx="83" cy="40" r="5.6" fill="#34D399"/>
    <circle cx="124" cy="46" r="4.6" fill="#CFFAFE"/>
    <path d="M45 137c10-6 17-6 27 0s17 6 27 0 17-6 24 0" stroke="#8AB4FF" stroke-opacity="0.6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M133 82l2.8 6.4 6.4 2.8-6.4 2.8-2.8 6.4-2.8-6.4-6.4-2.8 6.4-2.8 2.8-6.4z" fill="#EAF3FF" fill-opacity="0.9"/>
  </g>

  <g font-family="Inter, 'SF Pro Display', -apple-system, 'Segoe UI', sans-serif">
    <text x="304" y="232" font-size="86" font-weight="750" letter-spacing="-3.4" fill="url(#word)">miniDeepSeek</text>
    <text x="308" y="288" font-size="27" font-weight="450" fill="#A8BEE9">DeepSeek-V4, rebuilt small — from pretraining to OPD.</text>
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="17" fill="#7E98CC">
      <text x="309" y="342" letter-spacing="0.2">MoE top-2  ·  mHC  ·  CSA / HCA  ·  MTP  ·  Muon</text>
    </g>
    <g font-size="15" fill="#6F87B8">
      <rect x="304" y="368" width="176" height="34" rx="17" fill="#122248" stroke="#2B4786"/>
      <text x="392" y="390" text-anchor="middle" fill="#B9CDF3">60M – 220M params</text>
      <rect x="492" y="368" width="152" height="34" rx="17" fill="#0E2A2F" stroke="#1E5E66"/>
      <text x="568" y="390" text-anchor="middle" fill="#8FE7E0">CUDA + CPU debug</text>
      <rect x="656" y="368" width="142" height="34" rx="17" fill="#172140" stroke="#2B4786"/>
      <text x="727" y="390" text-anchor="middle" fill="#B9CDF3">MIT licensed</text>
    </g>
  </g>

