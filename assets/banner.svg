    </g>
    <text x="1352" y="462" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#5872A6" letter-spacing="2.4">SPARSE ATTENTION · ROUTED EXPERTS · MTP</text>
