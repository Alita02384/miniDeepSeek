    </g>
    <g>
      <circle cx="1352" cy="238" r="46" fill="#2F5BFF" fill-opacity="0.2" filter="url(#blur2)"/>
      <circle cx="1352" cy="238" r="16" fill="#34D399"/>
      <path d="M1352 176v30M1352 270v30M1290 238h30M1384 238h30" stroke="#8AB4FF" stroke-opacity="0.7" stroke-width="2"/>
      <g>
        <circle cx="1214" cy="152" r="22" fill="#0D1B38" stroke="#5B8CFF" stroke-opacity="0.7"/>
        <circle cx="1214" cy="152" r="7" fill="#8AB4FF"/>
        <circle cx="1488" cy="318" r="22" fill="#0D1B38" stroke="#22D3EE" stroke-opacity="0.7"/>
        <circle cx="1488" cy="318" r="7" fill="#22D3EE"/>
        <circle cx="1450" cy="112" r="16" fill="#0D1B38" stroke="#8AB4FF" stroke-opacity="0.45"/>
        <circle cx="1450" cy="112" r="5" fill="#C7D8FF"/>
