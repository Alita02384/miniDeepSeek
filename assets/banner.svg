    <rect x="0.75" y="0.75" width="166.5" height="166.5" rx="37.25" stroke="#3B5BA8" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="7" y="7" width="154" height="154" rx="32" fill="url(#grid)" opacity="0.5"/>
    <circle cx="84" cy="78" r="78" fill="#2F5BFF" fill-opacity="0.12"/>
    <path d="M42 122V88c0-15 10-25 23-25 11 0 18 7 18 18v41m0-41c0-11 7-18 18-18 13 0 23 10 23 25v34"
