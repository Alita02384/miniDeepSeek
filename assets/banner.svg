    <ellipse cx="1352" cy="238" rx="200" ry="112" transform="rotate(-18 1352 238)" stroke="#8AB4FF" stroke-opacity="0.16"/>
    <g fill="#9DB8F5">
      <circle cx="1164" cy="238" r="3.2"/><circle cx="1210" cy="184" r="2.4"/><circle cx="1290" cy="106" r="2.8"/>
      <circle cx="1352" cy="50" r="2.2"/><circle cx="1436" cy="140" r="3"/><circle cx="1508" cy="238" r="2.4"/>
      <circle cx="1470" cy="334" r="2.8"/><circle cx="1372" cy="404" r="2.2"/><circle cx="1250" cy="360" r="3"/>
