<text x="210.0" y="252" class="note" text-anchor="middle">通用指令数据</text>
<path d="M 210 271 V 295" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="295" width="340" height="76" rx="13" fill="#edf4ff" stroke="#b5d0ff"/>
