<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc">
<title id="title">miniDeepSeek 完整训练与三教师 OPD 流程</title>
<desc id="desc">预训练得到 base，分为 general、code、tool 三个完整模型，各自进行 SFT 和 GRPO。OPD 中学生生成同一批轨迹，三个冻结教师分别评分，各自计算反向 KL，加权后只更新学生。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="1240" rx="24" fill="#f8fafc"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17243b} .title{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:600}.note{font-size:16px;fill:#53647a}.small{font-size:15px;fill:#53647a}</style>
<text x="40" y="48" class="title" text-anchor="start">01  从零预训练 → 三个领域 specialist → 统一学生</text>
<rect x="280" y="75" width="640" height="76" rx="13" fill="#edf4ff" stroke="#b5d0ff"/>
<text x="600.0" y="106" class="label" text-anchor="middle">预训练 → Base 模型</text>
<text x="600.0" y="132" class="note" text-anchor="middle">通用 / 代码 / 工具语料 · 2K → 4K → 8K · LM + MTP</text>
