<text x="600.0" y="557" class="note" text-anchor="middle">冻结三个教师，融合通用对话、代码与工具调用能力</text>
<text x="600" y="608" class="note" text-anchor="middle">三个 specialist 是分别训练的完整模型；下图展开 OPD 的一次更新。</text>
<path d="M40 632 H1160" stroke="#d4deeb"/>
<text x="40" y="676" class="title" text-anchor="start">02  三个 specialist 如何共同参与 OPD</text>
<rect x="350" y="700" width="500" height="76" rx="13" fill="#fff5e7" stroke="#eed1a0"/>
<text x="600.0" y="731" class="label" text-anchor="middle">学生模型采样自己的回答</text>
<text x="600.0" y="757" class="note" text-anchor="middle">提示 → 学生生成轨迹（on-policy）</text>
