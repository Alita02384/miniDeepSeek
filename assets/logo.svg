<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">miniDeepSeek logo</title>
  <desc id="desc">A rounded square containing a wave-shaped letter m, three routed expert nodes, and an attention orbit.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="32" x2="432" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081228"/>
      <stop offset="0.55" stop-color="#0A1633"/>
      <stop offset="1" stop-color="#12224D"/>
    </linearGradient>
    <linearGradient id="mark" x1="120" y1="180" x2="392" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A9C6FF"/>
      <stop offset="0.45" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="150" x2="392" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8CFF" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#8AB4FF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(256 232) rotate(90) scale(232)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F5BFF" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#1B3A9E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0A1633" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="0" cy="0" r="1" gradientTransform="translate(256 128) rotate(90) scale(26)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#34D399"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#9DB8F5" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" stroke="#3B5BA8" stroke-opacity="0.55"/>
  <rect x="20" y="20" width="472" height="472" rx="98" stroke="#8AB4FF" stroke-opacity="0.08"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#grid)" opacity="0.55"/>
  <circle cx="256" cy="236" r="236" fill="url(#glow)"/>

  <ellipse cx="256" cy="270" rx="186" ry="112" transform="rotate(-12 256 270)" stroke="#8AB4FF" stroke-opacity="0.16" stroke-dasharray="3 10"/>
  <ellipse cx="256" cy="270" rx="148" ry="88" transform="rotate(-12 256 270)" stroke="#22D3EE" stroke-opacity="0.1"/>

  <path d="M136 360V268c0-43 28-69 64-69 32 0 50 21 50 52v109m0-109c0-31 18-52 50-52 36 0 64 26 64 69v92"
        stroke="#0A1633" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" filter="url(#soft)"/>
  <path d="M136 360V268c0-43 28-69 64-69 32 0 50 21 50 52v109m0-109c0-31 18-52 50-52 36 0 64 26 64 69v92"
        stroke="url(#mark)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M136 166v52M256 152v60M376 166v52" stroke="url(#line)" stroke-width="1.8" stroke-dasharray="2 8"/>

  <g>
    <circle cx="136" cy="156" r="14" fill="#5B8CFF" fill-opacity="0.24" filter="url(#nodeGlow)"/>
    <circle cx="136" cy="156" r="8" fill="#DCE8FF"/>
    <circle cx="256" cy="136" r="18" fill="#34D399" fill-opacity="0.28" filter="url(#nodeGlow)"/>
    <circle cx="256" cy="136" r="10" fill="url(#mint)"/>
    <circle cx="376" cy="156" r="14" fill="#22D3EE" fill-opacity="0.24" filter="url(#nodeGlow)"/>
    <circle cx="376" cy="156" r="8" fill="#CFFAFE"/>
  </g>

  <path d="M146 414c26-18 44-18 70 0s44 18 70 0 44-18 70 0" stroke="#8AB4FF" stroke-opacity="0.55" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="356" cy="414" r="4.5" fill="#22D3EE"/>

  <path d="M393 246l4.8 11.2L409 262l-11.2 4.8L393 278l-4.8-11.2L377 262l11.2-4.8L393 246z" fill="#E9F2FF" fill-opacity="0.9"/>
  <circle cx="404" cy="220" r="3" fill="#22D3EE"/>
</svg>
