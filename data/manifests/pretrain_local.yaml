# Local pretraining mix: the MiniMind corpus copied into data/raw/.
#
# Replaces data/manifests/pretrain_6b.yaml for runs that do not download the
# full 6B-token mix.  ~2.2B tokens are available; the 4x4090 curriculum uses
# ~1.2B of them in one pass.  Validate with:
#   .venv/bin/python -m minideepseek.data.prepare manifest \
#       --manifest data/manifests/pretrain_local.yaml
name: pretrain_local
seq_len: 8192
total_tokens: 1200000000
sources:
  - name: minimind_pretrain
    path: data/raw/pretrain_t2t.jsonl
    domain: general
    license: CC-BY-NC-4.0
    weight: 1.0
    available_tokens: 2200000000
    max_epochs: 1
