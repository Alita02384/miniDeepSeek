# 3B-token pretraining mix (doc/data_plan_145m.md §3.2, doc/batching.md).
#
# The three JSONL files are already exact-deduped and capped to the 3B budget
# (scripts/dedup_and_split.py).  Token counts are estimates from measured
# tok/char ratios; the packer on the training host re-measures them exactly.
name: pretrain_3b
seq_len: 4096
total_tokens: 3000000000
sources:
  - name: general
    path: data/tokenization/pretrain_general_4k.npz
    domain: general
    license: mixed (CC-BY-NC-4.0 minimind + ODC-By/CC-BY fineweb-edu/chinese-fineweb-edu/cosmopedia/finemath)
    weight: 0.82
    available_tokens: 2460000000
    max_epochs: 1
  - name: code
    path: data/tokenization/pretrain_code_4k.npz
    domain: code
    license: permissive (per-file, MIT/Apache-2.0/BSD/ISC/MPL/Unlicense)
    weight: 0.15
    available_tokens: 450000000
    max_epochs: 1
  - name: tool
    path: data/tokenization/pretrain_tool_4k.npz
    domain: tool
    license: apache-2.0 (ToolACE, glaive)
    weight: 0.03
    available_tokens: 90000000
    max_epochs: 1
