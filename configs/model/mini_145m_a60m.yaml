# mini_145m_a60m — MoE variant with the same active FFN width as the dense control.
#
# 6 routed experts, top-2 (33% activation rate), expert width 1.5d; hybrid
# attention is identical to mini_60m_dense_d768 (12 heads x 64).
# Measured (MTP depth 1, tied embeddings): 145.84M total / 60.91M active.
flavor: mini_145m_a60m
dim: 768
n_layers: 7
n_heads: 12
head_dim: 64
rope_head_dim: 32
q_lora_rank: 288
o_lora_rank: 288
n_groups: 2
compress_ratios: [0, 0, 4, 32, 4, 32, 4]
window_size: 128
index_n_heads: 8
index_head_dim: 64
moe_inter_dim: 1152
num_experts: 6
num_shared_experts: 0
top_k: 2
n_hash_layers: 2
route_norm: true
route_scale: 1.5
load_balance_coeff: 0.001
swiglu_limit: 10.0
hc_mult: 4
sinkhorn_iters: 20
vocab_size: 6400
tie_word_embeddings: true
n_mtp_layers: 1
seq_len: 4096
max_context: 8192
# Sparse top-k for CSA/HCA.  ``null`` would derive min(2048, seq_len // 4),
# which at this scale equals the *whole* compressed sequence (512 @2K,
# 1024 @4K, 2048 @8K): the sparse path degenerates to dense-over-compressed
# and attn_gym statically unrolls the selection loop over TOPK, so every one
# of those is also a 20+ minute compile.  64 keeps CSA genuinely sparse
# (12.5% / 6% / 3% of the compressed sequence) and inside the kernel's design
# envelope; see doc/decisions.md D74.
index_topk: 64
# HCA selects every compressed entry up to the current position, so at 8K
# (ratio 32) its kernel top-k is 256 -> a ~1 h Triton compile (TOPK is a
# constexpr, statically unrolled).  Capping at 128 keeps the most recent half:
# only the 8K stage is affected, and it reuses the 4K kernel.  See D74.
hca_topk_max: 128
indexer_loss_coeff: 0.01
device: auto
dtype: bfloat16
seed: 1234
