# mini_145m_a60m — MoE variant with the same active FFN width as the dense control.
#
# 6 routed experts, top-2 (33% activation rate), expert width 1.5d; hybrid
# attention is identical to mini_60m_dense_d768 (12 heads x 64).
# Measured (MTP depth 1, tied embeddings): 145.84M total / 60.91M active.
flavor: mini_145m_a60m
dim: 768
n_layers: 7
n_heads: 12
head_dim: 64
rope_head_dim: 32
q_lora_rank: 288
o_lora_rank: 288
n_groups: 2
compress_ratios: [0, 0, 4, 32, 4, 32, 4]
window_size: 128
index_n_heads: 8
index_head_dim: 64
moe_inter_dim: 1152
num_experts: 6
num_shared_experts: 0
top_k: 2
n_hash_layers: 2
route_norm: true
route_scale: 1.5
load_balance_coeff: 0.001
swiglu_limit: 10.0
hc_mult: 4
sinkhorn_iters: 20
vocab_size: 6400
tie_word_embeddings: true
n_mtp_layers: 1
seq_len: 4096
max_context: 8192
# null -> min(2048, max(seq_len // 4, 64)), i.e. 1024 @4K and 2048 @8K.
index_topk: null
indexer_loss_coeff: 0.01
device: auto
dtype: bfloat16
seed: 1234
