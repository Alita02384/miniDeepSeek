# Single-teacher OPD: the first step from roadmap section 5.
model:
  flavor: mini_60m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.000005
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  path: data/processed/opd/prompts_math.jsonl
  domain: math
train:
  steps: 200
  log_every: 1
  ckpt_every: 20
  resume: checkpoints/pretrain_pilot/final
  out_dir: checkpoints/opd_single_math
rl:
  method: opd
  prompts_per_step: 32
  max_new_tokens: 1024
  temperature: 1.0
  teacher_weights:
    math: 1.0
teachers:
  - name: math_teacher
    key: math
    checkpoint: checkpoints/grpo_math/final
    flavor: mini_60m
    seq_len: 4096
    weight: 1.0
distributed:
  mode: fsdp2
  param_dtype: bfloat16
  reduce_dtype: float32
