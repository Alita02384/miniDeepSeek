# Multi-teacher on-policy distillation. Student is the base checkpoint.
model:
  flavor: mini_60m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.000005
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  path: data/processed/opd/prompts_mixed.jsonl
  domain: mixed
train:
  steps: 500
  grad_accum: 1
  log_every: 1
  ckpt_every: 50
  out_dir: checkpoints/opd_three_teacher
rl:
  method: opd
  prompts_per_step: 32
  max_new_tokens: 1024
  temperature: 1.0
  teacher_weights:
    math: 0.3333333333
    code: 0.3333333333
    world: 0.3333333334
teachers:
  - name: math_teacher
    key: math
    checkpoint: checkpoints/grpo_math/final
    flavor: mini_60m
    seq_len: 4096
    weight: 0.3333333333
  - name: code_teacher
    key: code
    checkpoint: checkpoints/grpo_code/final
    flavor: mini_60m
    seq_len: 4096
    weight: 0.3333333333
  - name: world_teacher
    key: world
    checkpoint: checkpoints/sft_world/final
    flavor: mini_60m
    seq_len: 4096
    weight: 0.3333333334
