# Three-teacher OPD: general + tool + code.  The code slot stays empty until
# code SFT/GRPO data and checkpoints exist; preflight will fail loudly.
model_file: configs/model/mini_145m_a60m.yaml
model:
  flavor: mini_145m_a60m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.000005
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  # 9135 prompts: 6000 general/tool + 3135 code, built by
  # `build_opd_pool([opd_prompts_mixed, grpo_code_train], ...)`
  path: data/opd_prompts_three.jsonl
  domain: mixed
train:
  steps: 20
  grad_accum: 1
  activation_checkpointing: true
  log_every: 1
  ckpt_every: 10
  resume: checkpoints/sft_general_145m/final
  resume_step: false
  out_dir: checkpoints/opd_three_grpo_145m
rl:
  method: opd
  prompts_per_step: 16
  max_new_tokens: 512
  temperature: 0.8
  thinking_ratio: 0.1
  max_turns: 3
  rollout_backend: cached
  teacher_weights:
    general: 0.3333333333
    tool: 0.3333333333
    code: 0.3333333334
teachers:
  - name: general_teacher
    key: general
    checkpoint: checkpoints/grpo_general_145m/final
    flavor: mini_145m_a60m
    seq_len: 4096
    weight: 0.3333333333
  - name: tool_teacher
    key: tool
    checkpoint: checkpoints/grpo_tool_145m/final
    flavor: mini_145m_a60m
    seq_len: 4096
    weight: 0.3333333333
  - name: code_teacher
    key: code
    checkpoint: checkpoints/grpo_code_145m/final
    flavor: mini_145m_a60m
    seq_len: 4096
    weight: 0.3333333334
distributed:
  mode: ddp
  param_dtype: bfloat16
  reduce_dtype: float32
