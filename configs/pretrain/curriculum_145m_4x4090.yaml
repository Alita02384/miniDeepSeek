# 145M MoE, 2K -> 4K -> 8K length curriculum on 4x 24 GB cards (4090/3090).
#
# Token budget: ~1.2B tokens over ~2.2B available (one pass, no repeats).
#   2K stage: 1400 steps x 131072 tokens = 0.18B
#   4K stage: 5000 steps x 131072 tokens = 0.66B
#   8K stage: 1400 steps x 262144 tokens = 0.37B
# Every step count is cumulative; the trainer stops at `until_step`, so
# re-running this command resumes where the previous run stopped.
base_config: configs/pretrain/pretrain_145m.yaml
out_dir: checkpoints/curriculum_145m
mode: pretrain
stages:
  - seq_len: 2048
    tokenized_path: data/tokenized/pretrain_2k.npz
    until_step: 1400
    # Global micro-batch: 4 GPUs x 2048 = one 2K pack per rank, warming to two.
    batch_tokens: 8192
    batch_tokens_final: 16384
    batch_warmup_ratio: 0.1
  - seq_len: 4096
    tokenized_path: data/tokenized/pretrain_4k.npz
    until_step: 6400
    batch_tokens: 16384
    batch_tokens_final: 16384
    batch_warmup_ratio: 0.0
  - seq_len: 8192
    tokenized_path: data/tokenized/pretrain_8k.npz
    until_step: 7800
    # One 8K pack per rank; 24 GB needs per-block recompute at this length.
    batch_tokens: 32768
    batch_tokens_final: 32768
    batch_warmup_ratio: 0.0
    index_topk: 2048
    activation_checkpointing: true
