# Full 6B-token pretraining run: 12000 steps * 0.5M tokens.
model_file: configs/model/mini_220m_a80m.yaml
model:
  flavor: mini_220m_a80m
  seq_len: 4096
  n_mtp_layers: 1
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.0006
  muon_lr: 0.0006
  adamw_lr: 0.0006
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 500
  decay: cosine
  min_lr_ratio: 0.1
  decay_start_ratio: 0.8
data:
  tokenized_path: data/tokenization/pretrain_6b.npz
  batch_tokens: 16384
  batch_tokens_final: 65536
  batch_warmup_ratio: 0.1
  shuffle: true
  seed: 1234
train:
  steps: 12000
  grad_accum: 8
  log_every: 10
  ckpt_every: 500
  keep_last_ckpt: 8
  report_every: 50
  out_dir: checkpoints/pretrain_full
  mtp_weight: 0.3
  mtp_weight_final: 0.1
  mtp_decay_ratio: 0.8
  balance_loss_coeff: 0.0001
  index_topk_final: 64
  index_topk_warmup_ratio: 0.05
distributed:
  mode: fsdp2
  param_dtype: bfloat16
  reduce_dtype: float32
  reshard_after_forward: true
