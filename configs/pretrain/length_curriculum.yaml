# 2K -> 4K -> 8K sequence-length curriculum for the 6B-token run.
# Prepare each stage's packed dataset first; each stage resumes the previous
# checkpoint and uses cumulative until_step targets.
base_config: configs/pretrain/full_6b.yaml
out_dir: checkpoints/pretrain_curriculum
mode: pretrain
stages:
  - seq_len: 2048
    tokenized_path: data/tokenization/pretrain_2k.npz
    until_step: 1200
    batch_tokens: 8192
    batch_tokens_final: 32768
    batch_warmup_ratio: 0.1
  - seq_len: 4096
    tokenized_path: data/tokenization/pretrain_4k.npz
    until_step: 9600
    batch_tokens: 16384
    batch_tokens_final: 65536
    batch_warmup_ratio: 0.01
  - seq_len: 8192
    tokenized_path: data/tokenization/pretrain_8k.npz
    until_step: 12000
    batch_tokens: 16384
    batch_tokens_final: 65536
    batch_warmup_ratio: 0.0
    index_topk: 2048
