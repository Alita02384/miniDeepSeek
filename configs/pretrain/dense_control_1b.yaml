# Dense-attention control (compress_ratios all 0, window = seq_len), 1B tokens.
model:
  flavor: mini_60m_dense
  seq_len: 4096
  index_topk: 1024
  n_mtp_layers: 1
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.0006
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 200
  decay: cosine
  min_lr_ratio: 0.1
data:
  tokenized_path: data/tokenized/pretrain_1b.npz
  batch_tokens: 16384
  batch_tokens_final: 65536
  batch_warmup_ratio: 0.1
  shuffle: true
  seed: 1234
train:
  steps: 2000
  grad_accum: 8
  log_every: 10
  ckpt_every: 200
  out_dir: checkpoints/dense_control
  mtp_weight: 0.3
  mtp_weight_final: 0.1
  mtp_decay_ratio: 0.8
  balance_loss_coeff: 0.0001
