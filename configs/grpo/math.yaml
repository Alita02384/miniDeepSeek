# Domain GRPO. MTP is disabled for RL: the loss is defined on the main head.
model_file: configs/model/mini_220m_a80m.yaml
model:
  flavor: mini_220m_a80m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.000002
  muon_lr: 0.000002
  adamw_lr: 0.000002
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  path: data/processed/grpo/math/train.jsonl
  shuffle: true
  seed: 1234
  domain: math
train:
  steps: 200
  grad_accum: 1
  log_every: 1
  ckpt_every: 20
  resume: checkpoints/sft_math/final
  resume_step: false
  out_dir: checkpoints/grpo_math
rl:
  method: grpo
  group_size: 8
  prompts_per_step: 32
  max_new_tokens: 1024
  temperature: 1.0
  clip: 0.2
  kl_coeff: 0.0
reward:
  kind: math
  format_bonus: 0.1
  parse_bonus: 0.1
  length_penalty: 0.05
  max_length_penalty_at: 2048
distributed:
  mode: fsdp2
  param_dtype: bfloat16
  reduce_dtype: float32
