# Tool-use specialist RL: MiniMind agent_rl/agent_rl_math multi-turn tool tasks.
model_file: configs/model/mini_145m_a60m.yaml
model:
  flavor: mini_145m_a60m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.0000003
  muon_lr: 0.0000003
  adamw_lr: 0.0000003
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  path: data/grpo_tool_train.jsonl
  shuffle: true
  seed: 1234
  domain: tool
train:
  steps: 400
  grad_accum: 1
  log_every: 1
  ckpt_every: 25
  resume: checkpoints/sft_tool/final
  resume_step: false
  out_dir: checkpoints/grpo_tool_145m
rl:
  method: grpo
  group_size: 4
  prompts_per_step: 16
  max_new_tokens: 768
  temperature: 0.8
  clip: 0.2
  loss_type: cispo
  epsilon_high: 5.0
  kl_coeff: 0.0
  rollout_backend: cached
  recompute_old_logprobs: true
  thinking_ratio: 0.1
  max_turns: 3
  max_tool_calls: 4
reward:
  kind: tool
  reward_model_path: internlm2-1_8b-reward
  reward_model_dtype: float16
  length_bonus: 0.5
  think_bonus: 1.0
  repetition_penalty: 0.5
  reward_clip: 3.0
  tool_valid_bonus: 0.5
  tool_gt_weight: 2.5
  tool_unfinished_penalty: 0.5
  tool_tag_penalty: 0.5
distributed:
  mode: fsdp2
  param_dtype: bfloat16
  reduce_dtype: float32
