# Domain GRPO. MTP is disabled for RL: the loss is defined on the main head.
model_file: configs/model/mini_145m_a60m.yaml
model:
  flavor: mini_145m_a60m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.000002
  muon_lr: 0.000002
  adamw_lr: 0.000002
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  path: data/grpo_code_train.jsonl
  shuffle: true
  seed: 1234
  domain: code
train:
  steps: 200
  grad_accum: 1
  activation_checkpointing: true
  log_every: 1
  ckpt_every: 20
  keep_last_ckpt: 2
  auto_resume: true
  resume: checkpoints/sft_code_145m/final
  resume_step: false
  out_dir: checkpoints/grpo_code_145m
rl:
  method: grpo
  group_size: 4
  prompts_per_step: 8
  max_new_tokens: 768
  temperature: 0.8
  clip: 0.2
  loss_type: cispo
  epsilon_high: 5.0
  kl_coeff: 0.0
  rollout_backend: cached
  ppo_mini_batch_size: 16
  recompute_old_logprobs: true
reward:
  kind: code
  # Unit tests are the primary verifier.  These weights are intentionally
  # explicit so the code specialist reward can be tuned without touching the
  # executor; the values are a first pass.
  code_timeout_s: 5.0
  code_pass_reward: 1.0
  code_compile_bonus: 0.0
  code_syntax_penalty: 0.1
  code_format_bonus: 0.05
  length_bonus: 0.0
  think_bonus: 0.0
  repetition_penalty: 0.0
  reward_clip: 3.0
distributed:
  mode: ddp
  param_dtype: bfloat16
  reduce_dtype: float32
