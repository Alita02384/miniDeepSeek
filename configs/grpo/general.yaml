# General specialist RL: MiniMind rlaif prompt pool + 1.8B reward model.
model_file: configs/model/mini_145m_a60m.yaml
model:
  flavor: mini_145m_a60m
  seq_len: 4096
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.0000003
  muon_lr: 0.0000003
  adamw_lr: 0.0000003
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 0
  decay: constant
  min_lr_ratio: 1.0
data:
  path: data/grpo_general_train.jsonl
  shuffle: true
  seed: 1234
  domain: general
train:
  steps: 500
  grad_accum: 1
  log_every: 1
  ckpt_every: 50
  resume: checkpoints/sft_general/final
  resume_step: false
  out_dir: checkpoints/grpo_general
rl:
  method: grpo
  group_size: 6
  prompts_per_step: 32
  max_new_tokens: 1024
  temperature: 0.8
  clip: 0.2
  kl_coeff: 0.0
  thinking_ratio: 0.9
reward:
  kind: general
  reward_model_path: internlm2-1_8b-reward
  reward_model_dtype: float16
  length_bonus: 0.5
  think_bonus: 1.0
  repetition_penalty: 0.5
  reward_clip: 3.0
distributed:
  mode: fsdp2
  param_dtype: bfloat16
  reduce_dtype: float32
