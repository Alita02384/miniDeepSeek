# General specialist SFT (145M): broad chat/knowledge, a little code+tool to keep formats alive.
# Data: 90% general / 7% code / 3% tool
model_file: configs/model/mini_145m_a60m.yaml
model:
  flavor: mini_145m_a60m
  seq_len: 4096
  n_mtp_layers: 1
  swiglu_limit: 10.0
  device: auto
  dtype: bfloat16
  seed: 1234
optim:
  kind: hybrid
  lr: 0.00002
  muon_lr: 0.00002
  adamw_lr: 0.00002
  weight_decay: 0.1
  grad_clip: 1.0
schedule:
  warmup_steps: 10
  decay: cosine
  min_lr_ratio: 0.1
  decay_start_ratio: 0.8
data:
  sources:
    - path: data/tokenization/sft_general.npz
      weight: 0.8998
      domain: general
    - path: data/tokenization/sft_code.npz
      weight: 0.07
      domain: code
    - path: data/tokenization/sft_tool.npz
      weight: 0.03
      domain: tool
    # 69 identity records (~2.2k target tokens).  0.0002 over 66,432 micro-batches
    # gives ~13 passes, enough to fix "who are you" without drowning the mix.
    - path: data/tokenization/sft_identity.npz
      weight: 0.0002
      domain: general
  batch_tokens: 8192
  shuffle: true
  seed: 1234
  domain: general
  lockstep: false
train:
  # 重训新数据时换新 out_dir，或显式 train.force_restart: true；
  # out_dir/final 已存在且 resume 指向外部 base 时会被拒绝启动。
  steps: 4152
  resume: checkpoints/curriculum_145m_3b/stage_02_seq8192/final
  resume_data: false
  resume_optimizer: false
  resume_step: false
  grad_accum: 16
  log_every: 1
  ckpt_every: 500
  # Per-layer expert counts + domain share, same key the pretraining run logs.
  router_every: 10
  keep_last_ckpt: 1
  auto_resume: true
  # <|im_end|> is only ~0.3% of target tokens; 8x makes stopping learnable
  # (the previous run emitted it in 6-9% of rollouts and ran to the cap).
  eos_weight: 8.0
  eos_token_id: 2
  out_dir: checkpoints/sft_general_v2_145m
  mtp_weight: 0.3
  mtp_weight_final: 0.1
  mtp_decay_ratio: 0.8
  balance_loss_coeff: 0.0001
  index_topk_final: 64
  index_topk_warmup_ratio: 0.05
distributed:
  mode: ddp
  param_dtype: bfloat16
  reduce_dtype: float32
