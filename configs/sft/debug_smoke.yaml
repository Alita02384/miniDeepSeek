model:
  flavor: debugmodel
  seq_len: 256
  n_mtp_layers: 0
  swiglu_limit: 10.0
  device: cpu
  dtype: float32
  seed: 1234
  vocab_limit: 2048
optim:
  kind: hybrid
  lr: 0.0001
schedule:
  warmup_steps: 1
  decay: cosine
  min_lr_ratio: 0.1
data:
  tokenized_path: data/tokenization/debug_sft.npz
  batch_tokens: 256
  shuffle: true
  seed: 1234
  domain: general
train:
  steps: 2
  grad_accum: 1
  log_every: 1
  out_dir: checkpoints/debug_sft
  mtp_weight: 0.3
  balance_loss_coeff: 0.0001
